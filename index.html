<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>Espace en ligne · 3AIM CFA</title><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--navy:#1A3A6B;--navy2:#12213F;--or:#E87722;--bg:#F3F5F9;--card:#fff;--ink:#14213D;--mut:#5B6478;--line:#E1E5EE;--ok:#1F8A5B;--okbg:#E7F5EE;--wait:#B26A00;--waitbg:#FFF4E2}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.5}
header{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:18px 16px 22px;border-bottom:4px solid var(--or)}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;gap:12px}.top img{height:44px;background:#fff;border-radius:8px;padding:4px}.top .org{font-weight:800;font-size:18px}.top small{display:block;opacity:.8;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.hello{margin-top:14px;font-size:22px;font-weight:800}.hello span{display:block;font-size:14px;font-weight:400;opacity:.85}
main{padding:18px 0 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(20,33,61,.04)}
h2{font-size:18px;margin:0 0 4px}h3{font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);margin:16px 0 8px}
.meta{display:grid;gap:8px;margin-top:10px}.meta div{display:flex;gap:10px;align-items:flex-start}.meta b{min-width:92px;color:var(--mut);font-weight:600;font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:11px 14px;font-weight:700;font-size:15px;cursor:pointer;text-decoration:none;background:var(--navy);color:#fff}
.btn.or{background:var(--or)}.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}.btn[disabled]{opacity:.6}
.list{display:flex;flex-direction:column;gap:8px}.item{display:flex;align-items:center;gap:10px;justify-content:space-between;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.item span{min-width:0;overflow-wrap:anywhere}.tag{font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
.tag.ok{background:var(--okbg);color:var(--ok)}.tag.wait{background:var(--waitbg);color:var(--wait)}.tag.todo{background:#EEF1F7;color:var(--mut)}
.login{max-width:420px;margin:30px auto}.login input{width:100%;font-size:20px;letter-spacing:.12em;text-transform:uppercase;padding:12px;border:1px solid var(--line);border-radius:10px;margin:10px 0;text-align:center}
.err{color:#B42318;font-size:14px;min-height:20px}.hint{color:var(--mut);font-size:14px}
.steps{display:flex;flex-direction:column;gap:6px;margin-top:6px}.step{display:flex;justify-content:space-between;gap:10px;font-size:15px;border-bottom:1px dashed var(--line);padding:5px 0}
footer{color:var(--mut);font-size:13px;text-align:center;padding:10px 16px 30px}
a{color:var(--navy)}
@media (max-width:480px){.meta b{min-width:80px}.hello{font-size:20px}}
details.fold{padding:0}details.fold>summary{list-style:none;cursor:pointer;padding:14px 16px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:10px}
details.fold>summary::-webkit-details-marker{display:none}details.fold>summary:after{content:"+";font-size:20px;color:var(--or);font-weight:700}details.fold[open]>summary:after{content:"–"}
details.fold>.in{padding:0 16px 16px}details.fold .sub{display:block;font-weight:400;color:var(--mut);font-size:13px;margin-top:2px}
.sec{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:22px 2px 8px;font-weight:700}
.guide{margin:0;padding-left:18px;line-height:1.6}.guide li{margin-bottom:4px}.rgpd p{margin:0 0 8px;font-size:14px;line-height:1.55}
.wrap.wide{max-width:1040px}
.shell{display:grid;grid-template-columns:220px 1fr;gap:20px;align-items:start;margin-top:18px}
.nav{position:sticky;top:12px;display:flex;flex-direction:column;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px}
.nav button{display:flex;align-items:center;gap:10px;justify-content:flex-start;border:0;background:none;padding:11px 12px;border-radius:10px;font:inherit;font-weight:600;color:var(--ink);cursor:pointer;text-align:left}
.nav button:hover{background:var(--bg)}.nav button[aria-current=true]{background:var(--navy);color:#fff}
.nav .ic{width:20px;text-align:center}.nav .bd{margin-left:auto;background:var(--or);color:#fff;border-radius:999px;font-size:12px;padding:1px 8px;font-weight:700}
.nav hr{border:0;border-top:1px solid var(--line);margin:4px 6px}
.vt{font-size:20px;margin:2px 2px 4px;font-weight:800;color:var(--ink)}.vs{color:var(--mut);font-size:14px;margin:0 2px 14px}
.grp{font-weight:700;margin:4px 0 8px}
.tag.sign{background:#FDECEC;color:#B42318;margin-left:6px}.signhint{display:block;font-size:13px;color:var(--mut);margin-top:3px}
.cal-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.cal-h b{font-size:17px;text-transform:capitalize}
.cal-h button{border:1px solid var(--line);background:var(--bg);border-radius:8px;width:38px;height:34px;font-size:18px;cursor:pointer;color:var(--ink)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal .dn{font-size:12px;font-weight:700;color:var(--mut);text-align:center;padding:4px 0;text-transform:uppercase}
.cal .d{min-height:74px;border:1px solid var(--line);border-radius:8px;padding:4px 5px;font-size:12px;background:#fff;overflow:hidden}.cal .d.o{background:transparent;border-color:transparent}
.cal .d .n{font-weight:700;font-size:13px;color:var(--mut)}.cal .d.t{border-color:var(--or);box-shadow:inset 0 0 0 1px var(--or)}.cal .d.t .n{color:var(--or)}
.cal .ev{display:block;background:var(--navy);color:#fff;border-radius:5px;padding:2px 5px;margin-top:3px;font-size:11px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;border:0;width:100%;text-align:left;font-family:inherit}
.cal .ev.past{background:#9AA3B5}
.agenda .row2{display:flex;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}.agenda .row2:last-child{border-bottom:0}
.agenda .dt{flex:0 0 78px;text-align:center;background:var(--bg);border-radius:10px;padding:6px 4px;font-weight:700;line-height:1.15}.agenda .dt small{display:block;font-weight:600;color:var(--mut);font-size:11px;text-transform:uppercase}.agenda .dt big{display:block;font-size:22px;color:var(--navy)}
@media(max-width:820px){.cal .d{min-height:46px;padding:3px}.cal .ev{font-size:0;height:6px;padding:0;margin-top:4px;border-radius:3px}}
.tag.new{background:var(--or);color:#fff;margin-left:6px}
details.sess>summary{align-items:flex-start}details.sess .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
details.sess .sum{flex:1;min-width:0}details.sess .ttl{font-size:16px}
.chip{font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--bg);color:var(--mut);border:1px solid var(--line)}
.chip.now{background:#E7F5EE;color:#1F8A5B;border-color:#CBE9DA}.chip.soon{background:#EAF0FA;color:#1A3A6B;border-color:#D3DEF0}.chip.n{background:var(--or);color:#fff;border-color:var(--or)}
details.sess[open]>summary{border-bottom:1px solid var(--line);margin-bottom:12px}
@media(max-width:820px){.shell{grid-template-columns:1fr;gap:12px;margin-top:12px}
 .nav{flex-direction:row;flex-wrap:wrap;padding:6px;top:0;z-index:5;border-radius:12px;gap:4px}.nav::-webkit-scrollbar{display:none}
 .nav button{flex:1 1 auto;justify-content:center;padding:8px 10px;white-space:nowrap;font-size:14px;background:var(--bg)}.nav hr{display:none}}
.emm{position:fixed;inset:0;z-index:60;background:rgba(10,15,30,.55);display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:16px}
.emm-in{background:#fff;border-radius:16px;width:100%;max-width:640px;padding:16px;margin:auto 0;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.emm-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.emm-h b{font-size:17px}
.emm-t{font-weight:700;font-size:17px}.emm-err{background:#FDECEC;color:#B42318;padding:12px;border-radius:10px;font-weight:600}.emm-ok{background:var(--okbg);color:var(--ok);padding:10px 12px;border-radius:10px;font-weight:600;margin-top:10px}
.emm-list{border-top:1px solid var(--line)}.emm-li{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:11px 0;border-bottom:1px solid var(--line)}.emm-n{flex:1 1 170px;font-weight:600}
.emm-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between;margin-top:10px}
.emm-chips{display:flex;gap:6px;overflow-x:auto;padding:12px 0 4px}.emm-chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink)}.emm-chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.emm-pad{display:block;width:100%;height:220px;border:2px dashed #C9CCE0;border-radius:12px;background:#fff;touch-action:none}
.btn.sm{padding:7px 11px;font-size:13px}.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
</style></head>
<body>
<header><div class="wrap"><div class="top" id="top"><div><div class="org">3AIM CFA</div><small>Espace en ligne</small></div></div><div class="hello" id="hello"></div></div></header>
<main class="wrap" id="app"><div class="card"><p class="hint">Chargement…</p></div></main>
<footer id="foot">Espace sécurisé : vos informations ne sont visibles qu'avec votre code personnel.</footer>
<script>
var API = "https://script.google.com/macros/s/AKfycbwvKgk0-_aHsSybtgHRgZaNm6kY45E19P5s_HRXmicnYNtH_bvqYmx5tj0xZa3ONBs3/exec";
var CODE = (function(){try{var q=new URLSearchParams(location.search);return q.get("code")||q.get("c")||""}catch(e){return ""}})();
function api(params,ok,ko){var u=API+"?"+Object.keys(params).map(function(k){return k+"="+encodeURIComponent(params[k])}).join("&");fetch(u,{credentials:"omit",redirect:"follow"}).then(function(r){return r.json()}).then(ok).catch(ko)}
var DATA = null;
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function fd(d){try{return new Date(d+"T12:00:00").toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}catch(e){return d}}
function store(k,v){try{if(v==null)sessionStorage.removeItem(k);else sessionStorage.setItem(k,v)}catch(e){}}
function read(k){try{return sessionStorage.getItem(k)}catch(e){return null}}
function login(msg){
  $("#hello").textContent="";
  $("#app").innerHTML='<div class="card login"><h2>Accéder à mon espace</h2><p class="hint">Saisissez le code personnel reçu par e-mail de 3AIM CFA.</p><input id="code" autocomplete="one-time-code" placeholder="XXXX-XXXX-XXXX-XXXX" maxlength="24"><div class="err" id="err">'+esc(msg||"")+'</div><button class="btn or" id="go" style="width:100%">Entrer</button><p class="hint" style="margin-top:14px">Pas de code ? Contactez 3AIM CFA au <a href="tel:+262692098592">0692 09 85 92</a>.</p></div>';
  $("#go").onclick=function(){go($("#code").value)};$("#code").onkeydown=function(e){if(e.key==="Enter")go($("#code").value)};$("#code").focus();
}
function go(c){
  c=String(c||"").trim();if(!c){login("Saisissez votre code.");return}
  var b=$("#go");if(b){b.disabled=true;b.textContent="Vérification…"}
  api({api:"espace",code:c},function(r){
    if(!r||!r.ok){store("c",null);login(r&&r.msg||"Code inconnu.");return}
    CODE=c;store("c",c);DATA=r.data;render();
    try{history.replaceState(null,"",location.pathname)}catch(e){}
  },function(e){login("Service momentanément indisponible. Réessayez dans un instant.")});
}
var SEEN={};
function seenKey(){return "seen_"+String(CODE||"").toUpperCase().replace(/[^A-Z0-9]/g,"")}
function loadSeen(){SEEN={};(DATA&&DATA.seen||[]).forEach(function(i){SEEN[i]=1});try{JSON.parse(localStorage.getItem(seenKey())||"[]").forEach(function(i){SEEN[i]=1})}catch(e){}}
function markSeen(id){SEEN[id]=1;try{localStorage.setItem(seenKey(),JSON.stringify(Object.keys(SEEN)))}catch(e){}
  Array.prototype.forEach.call(document.querySelectorAll('[data-new="'+id+'"]'),function(x){x.remove()});
  Array.prototype.forEach.call(document.querySelectorAll('[data-dl="'+id+'"]'),function(b){b.textContent="Téléchargé ✓"});
  if(VIEW==="docs"){Array.prototype.forEach.call(document.querySelectorAll('[data-item="'+id+'"]'),function(x){x.style.opacity=".55"})}
  updBadges()}
function allDocs(p){var a=(p.docs||[]).slice();(p.sessions||[]).forEach(function(s){a=a.concat(s.docs||[])});var u={};return a.filter(function(d){if(u[d.id])return false;u[d.id]=1;return true})}
function newCount(docs){return (docs||[]).filter(function(d){return !SEEN[d.id]}).length}
function updBadges(){var n=newCount(allDocs(DATA)),b=document.querySelector('[data-v="docs"] .bd');if(b){if(n)b.textContent=n;else b.remove()}
  Array.prototype.forEach.call(document.querySelectorAll("[data-sn]"),function(x){var s=(DATA.sessions||[])[+x.getAttribute("data-sn")],k=newCount(s&&s.docs);if(k)x.textContent=k+" nouveau"+(k>1?"x":"");else x.remove()})}
function dl(id,btn){
  var t=btn.textContent;btn.disabled=true;btn.textContent="Ouverture…";
  api({api:"file",code:CODE,id:id},function(f){
    if(!f||!f.b64){btn.disabled=false;btn.textContent="Indisponible";alert("Ce document n'est pas disponible pour le moment.");return}
    var bin=atob(f.b64),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
    var url=URL.createObjectURL(new Blob([u],{type:f.mime||"application/pdf"}));var a=document.createElement("a");a.href=url;a.download=f.nom;document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(url)},60000);btn.disabled=false;btn.textContent=t;markSeen(id);
  },function(e){btn.disabled=false;btn.textContent="Indisponible";alert("Ce document n'est pas disponible pour le moment.")});
}
function docsHTML(docs){if(!docs||!docs.length)return "";return '<div class="list">'+docs.map(function(d){var n=!SEEN[d.id];return '<div class="item" data-item="'+esc(d.id)+'"><span>📄 '+esc(d.label||d.nom)+(d.sign?' <span class="tag sign">À signer</span>':'')+(n?' <span class="tag new" data-new="'+esc(d.id)+'">Nouveau</span>':'')+(d.sign?'<span class="signhint">✍️ '+esc(d.sign)+'</span>':'')+'</span><button class="btn ghost" data-dl="'+esc(d.id)+'">'+(n?"Télécharger":"Télécharger à nouveau")+'</button></div>'}).join("")+'</div>'}
function qk(u){return 'qc_'+String(u||'').slice(-48)}
function questHTML(q){if(!q||!q.length)return "";return '<div class="list">'+q.map(function(x){var c=0;try{c=+localStorage.getItem(qk(x.url))||0}catch(e){}return '<div class="item"><span>📝 '+esc(x.label)+(c&&!x.fait?'<br><small class="hint">Réponse envoyée ? Elle sera prise en compte dans quelques minutes, puis ce questionnaire disparaîtra.</small>':'')+'</span>'+(x.fait?'<span class="tag ok">✓ Répondu</span>':'<a class="btn or" data-qurl="'+esc(x.url)+'" href="'+esc(x.url)+'" target="_blank" rel="noopener">'+(c?'Rouvrir':'Répondre')+'</a>')+'</div>'}).join("")+'</div>'}
document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a[data-qurl]');if(!a)return;try{localStorage.setItem(qk(a.getAttribute('data-qurl')),String(Date.now()))}catch(x){}setTimeout(function(){try{render()}catch(x){}},600)});
var RL={client:"entreprise",stagiaire:"stagiaire",formateur:"formateur"};
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function sessionBody(s,role){var dates=(s.dates||[]).map(fd);
  return '<div class="meta">'+(dates.length?'<div><b>Date'+(dates.length>1?'s':'')+'</b><span>'+dates.map(esc).join("<br>")+'</span></div>':'<div><b>Dates</b><span>À fixer</span></div>')+
    (s.horaires?'<div><b>Horaires</b><span>'+esc(s.horaires)+'</span></div>':'')+
    (s.lieu?'<div><b>Lieu</b><span>'+esc(s.lieu)+(s.lieuAdr?'<br>'+esc(s.lieuAdr)+'<br><a href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(s.lieuAdr)+'" target="_blank" rel="noopener">Voir sur la carte</a>':'')+'</span></div>':'')+
    (s.entreprise&&role==="formateur"?'<div><b>Entreprise</b><span>'+esc(s.entreprise)+'</span></div>':'')+
    (s.formateur?'<div><b>Formateur</b><span>'+esc(s.formateur)+'</span></div>':'')+
    (s.stagiaires?'<div><b>Stagiaires</b><span>'+esc(s.stagiaires)+'</span></div>':'')+'</div>'+
    (s.etapes&&s.etapes.length?'<h3>Avancement</h3><div class="steps">'+s.etapes.map(function(e){return '<div class="step"><span>'+esc(e.l)+'</span><span class="tag '+(e.e==="ok"?"ok":e.e==="wait"?"wait":"todo")+'">'+esc(e.t)+'</span></div>'}).join("")+'</div>':'')+
    (s.infos?'<h3>À savoir</h3><p style="margin:0">'+esc(s.infos)+'</p>':'')+(s.em?'<h3>Émargement</h3><p style="margin:0 0 10px">'+(role==="formateur"?"Suis les présences de chaque demi-journée, note les absents et signe en fin de séance.":"Signez votre présence à chaque demi-journée, pendant la formation.")+'</p><button class="btn or" type="button" data-emopen="'+esc(s.sid)+'">✍️ '+(role==="formateur"?"Ouvrir l\'émargement":"Signer ma présence")+'</button>':'')+
    (s.quest&&s.quest.length?'<h3>Questionnaires</h3>'+questHTML(s.quest):'')+
    (s.docs&&s.docs.length?'<h3>Documents</h3>'+docsHTML(s.docs):'')}
function guideHTML(role){
  var g=role==="client"?["<b>Vos formations</b> : cliquez sur une formation pour l'ouvrir ou la refermer ; chaque carte correspond à une formation, avec ses dates, son lieu et la liste de vos salariés inscrits.","<b>Avancement</b> : suivez chaque étape (devis, convention, convocations, émargement, facture). Une pastille verte signifie que c'est fait, orange que nous attendons quelque chose de votre part.","<b>Documents</b> : ouvrez une formation pour retrouver tous ses documents (devis, convention, factures, certificats). La rubrique « Nouveaux documents » ne montre que ceux que vous n'avez pas encore téléchargés.","<b>Questionnaire</b> : en fin de formation, cliquez sur « Répondre » pour nous donner votre avis.","<b>Le menu</b> : à gauche (ou en haut sur téléphone), passez de vos formations à vos documents, questionnaires et contacts. Les formations passées sont rangées en bas de « Mes formations »."]
   :role==="formateur"?["<b>Tes sessions</b> : clique sur une session pour l'ouvrir ; chaque carte correspond à une intervention, avec les dates, les horaires, le lieu, l'entreprise et les stagiaires.","<b>Calendrier</b> : toutes tes dates d'intervention d'un coup d'œil, avec la liste des prochaines dates.","<b>Mes documents</b> : ce que tu dois faire signer (convention si tu es indépendant, feuille d'émargement) et les documents pas encore consultés.","<b>Émargement</b> : imprime la feuille, fais-la signer à chaque demi-journée et remets-la au centre en fin de session.","<b>Bilan de session</b> : après l'intervention, clique sur « Répondre » pour remplir le bilan en ligne.","<b>Le menu</b> : à gauche (ou en haut sur téléphone), passe de tes sessions aux documents, aux bilans et aux contacts. Les sessions passées sont rangées en bas de « Mes sessions »."]
   :["<b>Votre formation</b> : retrouvez les dates, les horaires et le lieu (avec le lien « Voir sur la carte »).","<b>Documents</b> : ouvrez votre formation pour télécharger votre convocation et le programme. La rubrique « Nouveaux documents » signale ce qui vient d'arriver.","<b>Questionnaires</b> : cliquez sur « Répondre ». Il y en a un avant la formation, un à la fin et un quelques mois après. Une fois envoyé, il passe en « Répondu ».","<b>Le menu</b> : à gauche (ou en haut sur téléphone), passez de votre formation à vos documents et questionnaires.</li><li><b>Sur téléphone</b> : ajoutez cette page à votre écran d'accueil pour la retrouver facilement."];
  return '<details class="card fold"><summary><span>Comment utiliser '+(role==="formateur"?"ton":"votre")+' espace<span class="sub">Le mode d\'emploi en quelques lignes</span></span></summary><div class="in"><ol class="guide">'+g.map(function(x){return "<li>"+x+"</li>"}).join("")+'</ol></div></details>'}
function rgpdHTML(role,o){var T=role==="formateur";

      return '<div class="emm-li"><span class="emm-n">'+esc(c.l)+'</span>'+(c.t?'<span class="tag ok">✓ Signé à '+esc(c.t)+'</span>':c.abs?'<span class="tag sign">Absent</span>':c.open?'<button class="btn or sm" type="button" data-emsig="'+esc(c.id)+'">Signer maintenant</button>':c.past?'<span class="tag todo">Non signé</span>':'<span class="tag todo">À venir</span>')+'</div>'}).join("")+'</div>');return}
  var cur=r.cids.filter(function(x){return x.id===EMS.cid})[0]||r.cids[0]||{},s=(r.slots||{})[cur.id]||{sigs:{},abs:{},fo:null},sg=s.sigs||{},ab=s.abs||{},n=r.roster.filter(function(p){return sg[p.k]}).length;EMS.cid=cur.id;
  emBox(top+'<div class="emm-chips">'+r.cids.map(function(x){return '<button type="button" class="emm-chip'+(x.id===cur.id?' on':'')+'" data-emc="'+esc(x.id)+'">'+esc(x.l)+(x.open?' ●':'')+'</button>'}).join("")+'</div>'+
    '<div class="emm-row"><b>Présences</b><span class="tag '+(n===r.roster.length?'ok':'wait')+'">'+n+' / '+r.roster.length+' signé'+(n>1?'s':'')+'</span><button class="btn ghost sm" type="button" data-emr="1">↻ Actualiser</button></div><div class="emm-list">'+
    r.roster.map(function(p){var g=sg[p.k];return '<div class="emm-li"><span class="emm-n">'+esc(p.n)+'</span>'+(g?'<span class="tag ok">✓ '+emHM(g.t)+'</span>':ab[p.k]?'<span class="tag sign">Absent</span><button class="btn ghost sm" type="button" data-emabs="'+esc(p.k)+'" data-on="0">Annuler</button>':(cur.open?'<button class="btn or sm" type="button" data-emsig="'+esc(cur.id)+'" data-who="'+esc(p.k)+'">Signer ici</button>':'')+'<button class="btn ghost sm" type="button" data-emabs="'+esc(p.k)+'" data-on="1">Absent</button>')+'</div>'}).join("")+'</div>'+
    '<p class="hint" style="margin:8px 0 0">Chaque stagiaire signe depuis son propre espace. « Signer ici » : il signe sur ton téléphone (s\'il n\'a pas accès à son espace).</p>'+
    '<div class="emm-row" style="margin-top:14px"><b>Ta signature de formateur</b>'+(s.fo?'<span class="tag ok">✓ Signé à '+emHM(s.fo.t)+'</span>':'<button class="btn sm" type="button" data-emsig="'+esc(cur.id)+'" data-who="fo">Signer en fin de demi-journée</button>')+'</div>')}
function emPad(cid,who){var r=EMS.st,c=r.cids.filter(function(x){return x.id===cid})[0]||{},p=who&&who!=="fo"?r.roster.filter(function(x){return x.k===who})[0]:null;
  var nm=r.role!=="formateur"?r.n:who==="fo"?"Formateur : "+(r.fo||""):p?p.n:"",txt=who==="fo"?"J'atteste que les présences indiquées sont exactes et que la séance s'est déroulée.":"J'atteste être présent(e) à cette séance de la formation « "+(r.intitule||"")+" ».";
  emBox('<span class="tag wait">'+esc(c.l||"")+'</span><div class="emm-t" style="margin-top:10px">'+esc(nm)+'</div><p style="margin:4px 0 10px">'+esc(txt)+'</p><canvas class="emm-pad"></canvas><div class="emm-row"><span class="hint">Signez avec le doigt dans le cadre</span><button class="btn ghost sm" type="button" data-emclr="1">Effacer</button></div><div class="emm-row" style="margin-top:12px"><button class="btn ghost" type="button" data-emback="1">‹ Retour</button><button class="btn or" type="button" id="em-ok" data-emok="1" disabled style="flex:1">Valider ma signature</button></div>');
  var cv=document.querySelector(".emm-pad"),ctx,n=0,dr=false,last=null;
  function size(){var b=cv.getBoundingClientRect(),d=Math.min(window.devicePixelRatio||1,2);cv.width=b.width*d;cv.height=b.height*d;ctx=cv.getContext("2d");ctx.scale(d,d);ctx.lineWidth=2.6;ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle="#0B1A4A";n=0;$("#em-ok").disabled=true}
  function pt(e){var b=cv.getBoundingClientRect();return [e.clientX-b.left,e.clientY-b.top]}
  cv.addEventListener("pointerdown",function(e){e.preventDefault();cv.setPointerCapture(e.pointerId);dr=true;last=pt(e)});
  cv.addEventListener("pointermove",function(e){if(!dr)return;var q=pt(e);ctx.beginPath();ctx.moveTo(last[0],last[1]);ctx.lineTo(q[0],q[1]);ctx.stroke();last=q;if(++n===12)$("#em-ok").disabled=false});
  ["pointerup","pointercancel","pointerleave"].forEach(function(t){cv.addEventListener(t,function(){dr=false})});
  EMS.pad={cid:cid,who:who||"",size:size,get:function(){var o=document.createElement("canvas"),W=360;o.width=W;o.height=Math.round(W*cv.height/cv.width);o.getContext("2d").drawImage(cv,0,0,o.width,o.height);return o.toDataURL("image/png")}};
  setTimeout(size,30)}
function emClick(e){var b=e.target.closest("button");if(!b)return;
  if(b.getAttribute("data-emx")){emClose();return}
  if(b.getAttribute("data-emc")){EMS.cid=b.getAttribute("data-emc");emDraw();return}
  if(b.getAttribute("data-emr")){emBox('<p class="hint">Actualisation…</p>');emLoad();return}
  if(b.getAttribute("data-emsig")){emPad(b.getAttribute("data-emsig"),b.getAttribute("data-who")||"");return}
  if(b.getAttribute("data-emclr")){EMS.pad&&EMS.pad.size();return}
  if(b.getAttribute("data-emback")){emDraw();return}
  if(b.getAttribute("data-emabs")){b.disabled=true;api({api:"emabs",code:CODE,ses:EMS.sid,cid:EMS.cid,k:b.getAttribute("data-emabs"),on:b.getAttribute("data-on")},function(r){if(!r||!r.ok)alert(r&&r.msg||"Erreur");emLoad()},function(){alert("Connexion impossible.");b.disabled=false});return}
  if(b.getAttribute("data-emok")){if(b.disabled||!EMS.pad)return;b.disabled=true;b.textContent="Enregistrement…";var P=EMS.pad;
    emPost({api:"emsign",code:CODE,sid:EMS.sid,cid:P.cid,who:P.who,img:P.get(),dev:emDev(),ua:navigator.userAgent},function(r){
      if(!r||!r.ok){b.disabled=false;b.textContent="Valider ma signature";alert(r&&r.msg||"Erreur");return}
      EMS.pad=null;api({api:"emstate",code:CODE,ses:EMS.sid},function(s){EMS.st=s;emDraw(EMS.st.role==="formateur"?"Signature enregistrée.":"Présence enregistrée à "+(r.t||"")+". Merci !")},function(){emClose()})});return}}
document.addEventListener("click",function(e){var b=e.target.closest&&e.target.closest("[data-emopen]");if(b){e.preventDefault();emOpen(b.getAttribute("data-emopen"))}});
