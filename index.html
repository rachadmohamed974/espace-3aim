<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>Espace en ligne · 3AIM CFA</title><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--navy:#1A3A6B;--navy2:#12213F;--or:#E87722;--bg:#F3F5F9;--card:#fff;--ink:#14213D;--mut:#5B6478;--line:#E1E5EE;--ok:#1F8A5B;--okbg:#E7F5EE;--wait:#B26A00;--waitbg:#FFF4E2}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.5}
header{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:18px 16px 22px;border-bottom:4px solid var(--or)}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;gap:12px}.top img{height:44px;background:#fff;border-radius:8px;padding:4px}.top .org{font-weight:800;font-size:18px}.top small{display:block;opacity:.8;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.hello{margin-top:14px;font-size:22px;font-weight:800}.hello span{display:block;font-size:14px;font-weight:400;opacity:.85}
main{padding:18px 0 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(20,33,61,.04)}
h2{font-size:18px;margin:0 0 4px}h3{font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);margin:16px 0 8px}
.meta{display:grid;gap:8px;margin-top:10px}.meta div{display:flex;gap:10px;align-items:flex-start}.meta b{min-width:92px;color:var(--mut);font-weight:600;font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:11px 14px;font-weight:700;font-size:15px;cursor:pointer;text-decoration:none;background:var(--navy);color:#fff}
.btn.or{background:var(--or)}.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}.btn[disabled]{opacity:.6}
.list{display:flex;flex-direction:column;gap:8px}.item{display:flex;align-items:center;gap:10px;justify-content:space-between;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.item span{min-width:0;overflow-wrap:anywhere}.tag{font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
.tag.ok{background:var(--okbg);color:var(--ok)}.tag.wait{background:var(--waitbg);color:var(--wait)}.tag.todo{background:#EEF1F7;color:var(--mut)}
.login{max-width:420px;margin:30px auto}.login input{width:100%;font-size:20px;letter-spacing:.12em;text-transform:uppercase;padding:12px;border:1px solid var(--line);border-radius:10px;margin:10px 0;text-align:center}
.err{color:#B42318;font-size:14px;min-height:20px}.hint{color:var(--mut);font-size:14px}
.steps{display:flex;flex-direction:column;gap:6px;margin-top:6px}.step{display:flex;justify-content:space-between;gap:10px;font-size:15px;border-bottom:1px dashed var(--line);padding:5px 0}
footer{color:var(--mut);font-size:13px;text-align:center;padding:10px 16px 30px}
a{color:var(--navy)}
@media (max-width:480px){.meta b{min-width:80px}.hello{font-size:20px}}
details.fold{padding:0}details.fold>summary{list-style:none;cursor:pointer;padding:14px 16px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:10px}
details.fold>summary::-webkit-details-marker{display:none}details.fold>summary:after{content:"+";font-size:20px;color:var(--or);font-weight:700}details.fold[open]>summary:after{content:"–"}
details.fold>.in{padding:0 16px 16px}details.fold .sub{display:block;font-weight:400;color:var(--mut);font-size:13px;margin-top:2px}
.sec{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:22px 2px 8px;font-weight:700}
.guide{margin:0;padding-left:18px;line-height:1.6}.guide li{margin-bottom:4px}.rgpd p{margin:0 0 8px;font-size:14px;line-height:1.55}
.wrap.wide{max-width:1040px}
.shell{display:grid;grid-template-columns:220px 1fr;gap:20px;align-items:start;margin-top:18px}
.nav{position:sticky;top:12px;display:flex;flex-direction:column;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px}
.nav button{display:flex;align-items:center;gap:10px;justify-content:flex-start;border:0;background:none;padding:11px 12px;border-radius:10px;font:inherit;font-weight:600;color:var(--ink);cursor:pointer;text-align:left}
.nav button:hover{background:var(--bg)}.nav button[aria-current=true]{background:var(--navy);color:#fff}
.nav .ic{width:20px;text-align:center}.nav .bd{margin-left:auto;background:var(--or);color:#fff;border-radius:999px;font-size:12px;padding:1px 8px;font-weight:700}
.nav hr{border:0;border-top:1px solid var(--line);margin:4px 6px}
.vt{font-size:20px;margin:2px 2px 4px;font-weight:800;color:var(--ink)}.vs{color:var(--mut);font-size:14px;margin:0 2px 14px}
.grp{font-weight:700;margin:4px 0 8px}
@media(max-width:820px){.shell{grid-template-columns:1fr;gap:12px;margin-top:12px}
 .nav{flex-direction:row;flex-wrap:wrap;padding:6px;top:0;z-index:5;border-radius:12px;gap:4px}.nav::-webkit-scrollbar{display:none}
 .nav button{flex:1 1 auto;justify-content:center;padding:8px 10px;white-space:nowrap;font-size:14px;background:var(--bg)}.nav hr{display:none}}
</style></head>
<body>
<header><div class="wrap"><div class="top" id="top"><div><div class="org">3AIM CFA</div><small>Espace en ligne</small></div></div><div class="hello" id="hello"></div></div></header>
<main class="wrap" id="app"><div class="card"><p class="hint">Chargement…</p></div></main>
<footer id="foot">Espace sécurisé : vos informations ne sont visibles qu'avec votre code personnel.</footer>
<script>
var API = "https://script.google.com/macros/s/AKfycbyI9dsjJUgnU6OCaxbrA191MsGhaEoVz8vPJCXPTSn9_s9lg0tp9FZZLqmfB0fxL2vt/exec";
var CODE = (function(){try{var q=new URLSearchParams(location.search);return q.get("code")||q.get("c")||""}catch(e){return ""}})();
function api(params,ok,ko){var u=API+"?"+Object.keys(params).map(function(k){return k+"="+encodeURIComponent(params[k])}).join("&");fetch(u,{credentials:"omit",redirect:"follow"}).then(function(r){return r.json()}).then(ok).catch(ko)}
var DATA = null;
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function fd(d){try{return new Date(d+"T12:00:00").toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}catch(e){return d}}
function store(k,v){try{if(v==null)sessionStorage.removeItem(k);else sessionStorage.setItem(k,v)}catch(e){}}
function read(k){try{return sessionStorage.getItem(k)}catch(e){return null}}
function login(msg){
  $("#hello").textContent="";
  $("#app").innerHTML='<div class="card login"><h2>Accéder à mon espace</h2><p class="hint">Saisissez le code personnel reçu par e-mail de 3AIM CFA.</p><input id="code" autocomplete="one-time-code" placeholder="XXXX-XXXX-XXXX-XXXX" maxlength="24"><div class="err" id="err">'+esc(msg||"")+'</div><button class="btn or" id="go" style="width:100%">Entrer</button><p class="hint" style="margin-top:14px">Pas de code ? Contactez 3AIM CFA au <a href="tel:+262692098592">0692 09 85 92</a>.</p></div>';
  $("#go").onclick=function(){go($("#code").value)};$("#code").onkeydown=function(e){if(e.key==="Enter")go($("#code").value)};$("#code").focus();
}
function go(c){
  c=String(c||"").trim();if(!c){login("Saisissez votre code.");return}
  var b=$("#go");if(b){b.disabled=true;b.textContent="Vérification…"}
  api({api:"espace",code:c},function(r){
    if(!r||!r.ok){store("c",null);login(r&&r.msg||"Code inconnu.");return}
    CODE=c;store("c",c);DATA=r.data;render();
    try{history.replaceState(null,"",location.pathname)}catch(e){}
  },function(e){login("Service momentanément indisponible. Réessayez dans un instant.")});
}
function dl(id,btn){
  var t=btn.textContent;btn.disabled=true;btn.textContent="Ouverture…";
  api({api:"file",code:CODE,id:id},function(f){
    if(!f||!f.b64){btn.disabled=false;btn.textContent="Indisponible";alert("Ce document n'est pas disponible pour le moment.");return}
    var bin=atob(f.b64),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
    var url=URL.createObjectURL(new Blob([u],{type:f.mime||"application/pdf"}));var a=document.createElement("a");a.href=url;a.download=f.nom;document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(url)},60000);btn.disabled=false;btn.textContent=t;
  },function(e){btn.disabled=false;btn.textContent="Indisponible";alert("Ce document n'est pas disponible pour le moment.")});
}
function docsHTML(docs){if(!docs||!docs.length)return "";return '<div class="list">'+docs.map(function(d){return '<div class="item"><span>📄 '+esc(d.label||d.nom)+'</span><button class="btn ghost" data-dl="'+esc(d.id)+'">Télécharger</button></div>'}).join("")+'</div>'}
function questHTML(q){if(!q||!q.length)return "";return '<div class="list">'+q.map(function(x){return '<div class="item"><span>📝 '+esc(x.label)+'</span>'+(x.fait?'<span class="tag ok">✓ Répondu</span>':'<a class="btn or" href="'+esc(x.url)+'" target="_blank" rel="noopener">Répondre</a>')+'</div>'}).join("")+'</div>'}
var RL={client:"entreprise",stagiaire:"stagiaire",formateur:"formateur"};
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function sessionBody(s,role){var dates=(s.dates||[]).map(fd);
  return '<div class="meta">'+(dates.length?'<div><b>Date'+(dates.length>1?'s':'')+'</b><span>'+dates.map(esc).join("<br>")+'</span></div>':'<div><b>Dates</b><span>À fixer</span></div>')+
    (s.horaires?'<div><b>Horaires</b><span>'+esc(s.horaires)+'</span></div>':'')+
    (s.lieu?'<div><b>Lieu</b><span>'+esc(s.lieu)+(s.lieuAdr?'<br>'+esc(s.lieuAdr)+'<br><a href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(s.lieuAdr)+'" target="_blank" rel="noopener">Voir sur la carte</a>':'')+'</span></div>':'')+
    (s.entreprise&&role==="formateur"?'<div><b>Entreprise</b><span>'+esc(s.entreprise)+'</span></div>':'')+
    (s.formateur?'<div><b>Formateur</b><span>'+esc(s.formateur)+'</span></div>':'')+
    (s.stagiaires?'<div><b>Stagiaires</b><span>'+esc(s.stagiaires)+'</span></div>':'')+'</div>'+
    (s.etapes&&s.etapes.length?'<h3>Avancement</h3><div class="steps">'+s.etapes.map(function(e){return '<div class="step"><span>'+esc(e.l)+'</span><span class="tag '+(e.e==="ok"?"ok":e.e==="wait"?"wait":"todo")+'">'+esc(e.t)+'</span></div>'}).join("")+'</div>':'')+
    (s.infos?'<h3>À savoir</h3><p style="margin:0">'+esc(s.infos)+'</p>':'')+
    (s.quest&&s.quest.length?'<h3>Questionnaires</h3>'+questHTML(s.quest):'')+
    (s.docs&&s.docs.length?'<h3>Documents</h3>'+docsHTML(s.docs):'')}
function guideHTML(role){
  var g=role==="client"?["<b>Vos formations</b> : chaque carte correspond à une formation, avec ses dates, son lieu et la liste de vos salariés inscrits.","<b>Avancement</b> : suivez chaque étape (devis, convention, convocations, émargement, facture). Une pastille verte signifie que c'est fait, orange que nous attendons quelque chose de votre part.","<b>Documents</b> : cliquez sur « Télécharger » pour récupérer devis, conventions, factures et certificats de réalisation.","<b>Questionnaire</b> : en fin de formation, cliquez sur « Répondre » pour nous donner votre avis.","<b>Le menu</b> : à gauche (ou en haut sur téléphone), passez de vos formations à vos documents, questionnaires et contacts. Les formations passées sont rangées en bas de « Mes formations »."]
   :role==="formateur"?["<b>Tes sessions</b> : chaque carte correspond à une intervention, avec les dates, les horaires, le lieu, l'entreprise et les stagiaires.","<b>Convention d'intervention</b> : télécharge-la, signe-la et renvoie-la nous. La pastille passe au vert à réception.","<b>Émargement</b> : imprime la feuille, fais-la signer à chaque demi-journée et remets-la au centre en fin de session.","<b>Bilan de session</b> : après l'intervention, clique sur « Répondre » pour remplir le bilan en ligne.","<b>Le menu</b> : à gauche (ou en haut sur téléphone), passe de tes sessions aux documents, aux bilans et aux contacts. Les sessions passées sont rangées en bas de « Mes sessions »."]
   :["<b>Votre formation</b> : retrouvez les dates, les horaires et le lieu (avec le lien « Voir sur la carte »).","<b>Documents</b> : cliquez sur « Télécharger » pour obtenir votre convocation et le programme.","<b>Questionnaires</b> : cliquez sur « Répondre ». Il y en a un avant la formation, un à la fin et un quelques mois après. Une fois envoyé, il passe en « Répondu ».","<b>Le menu</b> : à gauche (ou en haut sur téléphone), passez de votre formation à vos documents et questionnaires.</li><li><b>Sur téléphone</b> : ajoutez cette page à votre écran d'accueil pour la retrouver facilement."];
  return '<details class="card fold"><summary><span>Comment utiliser '+(role==="formateur"?"ton":"votre")+' espace<span class="sub">Le mode d\'emploi en quelques lignes</span></span></summary><div class="in"><ol class="guide">'+g.map(function(x){return "<li>"+x+"</li>"}).join("")+'</ol></div></details>'}
function rgpdHTML(role,o){var T=role==="formateur";
  return '<details class="card fold rgpd"><summary><span>'+(T?"Tes":"Vos")+' données personnelles (RGPD)<span class="sub">Qui voit quoi, et '+(T?"tes":"vos")+' droits</span></span></summary><div class="in">'+
  '<p><b>Qui voit '+(T?"tes":"vos")+' informations ?</b> Seulement '+(T?"toi":"vous")+' et l\'équipe de '+esc(o.nom||"3AIM CFA")+'. Chaque espace est protégé par un code personnel unique : personne d\'autre ne peut consulter '+(T?"tes":"vos")+' formations ou '+(T?"tes":"vos")+' documents.</p>'+
  '<p><b>Pourquoi ces données ?</b> Pour organiser et suivre la formation, établir les documents obligatoires (conventions, convocations, émargement, attestations, factures) et répondre aux exigences de qualité Qualiopi.</p>'+
  '<p><b>Combien de temps ?</b> Le temps de la formation, puis la durée imposée par la réglementation (pièces comptables et preuves de réalisation). Les connexions à cet espace sont enregistrées (date, action) pour la sécurité et le suivi qualité.</p>'+
  '<p><b>'+(T?"Tes":"Vos")+' droits</b> : '+(T?"tu peux":"vous pouvez")+' demander à tout moment l\'accès à '+(T?"tes":"vos")+' données, leur correction ou leur suppression (dans la limite des obligations légales), en écrivant à <a href="mailto:'+esc(o.email||"")+'">'+esc(o.email||"")+'</a>. '+(T?"Tu peux":"Vous pouvez")+' aussi saisir la CNIL (cnil.fr).</p>'+
  '<p><b>Un conseil</b> : '+(T?"ton":"votre")+' lien et '+(T?"ton":"votre")+' code sont personnels, ne '+(T?"les transmets":"les transmettez")+' pas. Sur un ordinateur partagé, '+(T?"pense":"pensez")+' à cliquer sur « Se déconnecter ».</p></div></details>'}
var VIEW=null;
function sortS(p){return (p.sessions||[]).slice().sort(function(a,b){return String((a.dates||["9"])[0]).localeCompare(String((b.dates||["9"])[0]))})}
function sTitle(s){var d=s.dates||[];return esc(s.intitule)+'<span class="sub">'+(d.length?esc(fd(d[0]))+(d.length>1?" → "+esc(fd(d[d.length-1])):""):"Dates à fixer")+(s.numero?" · Réf. "+esc(s.numero):"")+'</span>'}
function infoBody(s,role){var dates=(s.dates||[]).map(fd);
  return '<div class="meta">'+(dates.length?'<div><b>Date'+(dates.length>1?'s':'')+'</b><span>'+dates.map(esc).join("<br>")+'</span></div>':'<div><b>Dates</b><span>À fixer</span></div>')+
    (s.horaires?'<div><b>Horaires</b><span>'+esc(s.horaires)+'</span></div>':'')+
    (s.lieu?'<div><b>Lieu</b><span>'+esc(s.lieu)+(s.lieuAdr?'<br>'+esc(s.lieuAdr)+'<br><a href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(s.lieuAdr)+'" target="_blank" rel="noopener">Voir sur la carte</a>':'')+'</span></div>':'')+
    (s.entreprise&&role==="formateur"?'<div><b>Entreprise</b><span>'+esc(s.entreprise)+'</span></div>':'')+
    (s.formateur?'<div><b>Formateur</b><span>'+esc(s.formateur)+'</span></div>':'')+
    (s.stagiaires?'<div><b>Stagiaires</b><span>'+esc(s.stagiaires)+'</span></div>':'')+'</div>'+
    (s.etapes&&s.etapes.length?'<h3>Avancement</h3><div class="steps">'+s.etapes.map(function(e){return '<div class="step"><span>'+esc(e.l)+'</span><span class="tag '+(e.e==="ok"?"ok":e.e==="wait"?"wait":"todo")+'">'+esc(e.t)+'</span></div>'}).join("")+'</div>':'')+
    (s.infos?'<h3>À savoir</h3><p style="margin:0">'+esc(s.infos)+'</p>':'')}
function viewSessions(p,role){var T=role==="formateur",t=today(),ss=sortS(p),h="";
  var now=ss.filter(function(s){var d=s.dates||[];return !d.length||d[d.length-1]>=t}),past=ss.filter(function(s){var d=s.dates||[];return d.length&&d[d.length-1]<t}).reverse();
  if(!now.length)h+='<div class="card"><p class="hint" style="margin:0">'+(past.length?"Aucune "+(T?"session":"formation")+" à venir pour le moment.":"Rien pour le moment : "+(T?"tes sessions":"vos formations")+" apparaîtront ici dès qu'elles seront programmées.")+'</p></div>';
  now.forEach(function(s){h+='<div class="card"><h2>'+esc(s.intitule)+'</h2>'+(s.numero?'<div class="hint">Réf. '+esc(s.numero)+'</div>':'')+infoBody(s,role)+'</div>'});
  if(past.length){h+='<div class="sec">'+(T?"Sessions passées":"Formations passées")+' ('+past.length+')</div>';past.forEach(function(s){h+='<details class="card fold"><summary><span>'+sTitle(s)+'</span></summary><div class="in">'+infoBody(s,role)+'</div></details>'})}
  return h}
function viewList(p,key,html,empty){var ss=sortS(p).reverse().filter(function(s){return s[key]&&s[key].length}),h="";
  if(key==="docs"&&p.docs&&p.docs.length)h+='<div class="card"><div class="grp">Documents généraux</div>'+docsHTML(p.docs)+'</div>';
  ss.forEach(function(s){h+='<div class="card"><div class="grp">'+esc(s.intitule)+' <span class="hint" style="font-weight:400">· '+((s.dates||[]).length?esc(fd(s.dates[0])):"dates à fixer")+'</span></div>'+html(s[key])+'</div>'});
  return h||'<div class="card"><p class="hint" style="margin:0">'+empty+'</p></div>'}
function viewContact(p,role,o){var T=role==="formateur";
  return '<div class="card"><h2>Une question ?</h2><div class="meta"><div><b>Téléphone</b><span><a href="tel:'+esc((o.tel||"").replace(/\s/g,""))+'">'+esc(o.tel||"")+'</a></span></div><div><b>E-mail</b><span><a href="mailto:'+esc(o.email||"")+'">'+esc(o.email||"")+'</a></span></div><div><b>Adresse</b><span>'+esc(o.adresse||"")+'</span></div>'+(o.referent&&!T?'<div><b>Handicap</b><span>Référent handicap : '+esc(o.referent)+' — nous adaptons la formation si besoin.</span></div>':'')+'</div></div>'+
    rgpdHTML(role,o).replace('<details class="card fold rgpd">','<details class="card fold rgpd" open>')}
function render(){
  var p=DATA,o=p.org||{},role=p.role||"stagiaire",T=role==="formateur";
  $("#app").className="wrap wide";var hw=document.querySelector("header .wrap");if(hw)hw.classList.add("wide");
  $("#top").innerHTML=(o.logo?'<img src="'+o.logo+'" alt="">':'')+'<div><div class="org">'+esc(o.nom||"3AIM CFA")+'</div><small>Espace '+RL[role]+'</small></div>';
  $("#hello").innerHTML="Bonjour "+esc(role==="client"?(p.contact||p.entreprise||""):(p.prenom||p.nom||""))+'<span>'+(role==="client"?esc(p.entreprise||"")+" · vos formations avec 3AIM CFA":T?"Tes interventions pour 3AIM CFA":"Toutes les informations sur votre formation")+'</span>';
  var ss=p.sessions||[],nd=(p.docs||[]).length,nq=0,todo=0;ss.forEach(function(s){nd+=(s.docs||[]).length;(s.quest||[]).forEach(function(q){nq++;if(!q.fait)todo++})});
  var V=[["sessions","📅",T?"Mes sessions":role==="client"?"Mes formations":"Ma formation",T?"Dates, lieux, entreprises et stagiaires de tes interventions.":"Dates, horaires, lieu et avancement."],
    ["docs","📄","Documents",T?"Ta convention, la feuille d'émargement et les programmes, à télécharger.":"Tous "+(role==="client"?"vos":"vos")+" documents à télécharger."]];
  if(nq)V.push(["quest","📝",T?"Bilans":"Questionnaires",T?"Le bilan à remplir après chaque session.":"Les questionnaires à remplir. Une fois envoyés, ils passent en « Répondu »."]);
  V.push(["aide","❓","Mode d'emploi","Comment utiliser "+(T?"ton":"votre")+" espace."],["contact","☎️","Contact et données",T?"Nous joindre, et tes données personnelles (RGPD).":"Nous joindre, et vos données personnelles (RGPD)."]);
  if(!VIEW)VIEW=read("v")||"sessions";if(!V.some(function(v){return v[0]===VIEW}))VIEW="sessions";
  var cur=V.filter(function(v){return v[0]===VIEW})[0],body="";
  if(VIEW==="sessions")body=viewSessions(p,role);
  else if(VIEW==="docs")body=viewList(p,"docs",docsHTML,"Aucun document pour le moment.");
  else if(VIEW==="quest")body=viewList(p,"quest",questHTML,"Aucun questionnaire pour le moment.");
  else if(VIEW==="aide")body=guideHTML(role).replace('<details class="card fold">','<details class="card fold" open>');
  else body=viewContact(p,role,o);
  var nav=V.map(function(v,i){var b=v[0]==="docs"&&nd?nd:v[0]==="quest"&&todo?todo:0;return (v[0]==="aide"?"<hr>":"")+'<button type="button" data-v="'+v[0]+'" aria-current="'+(v[0]===VIEW)+'"><span class="ic">'+v[1]+'</span>'+esc(v[2])+(b?'<span class="bd">'+b+'</span>':'')+'</button>'}).join("")+'<hr><button type="button" id="out"><span class="ic">⎋</span>Se déconnecter</button>';
  $("#app").innerHTML='<div class="shell"><nav class="nav" aria-label="Menu">'+nav+'</nav><div><div class="vt">'+esc(cur[2])+'</div><p class="vs">'+esc(cur[3])+'</p>'+body+'</div></div>';
  $("#foot").textContent="Informations mises à jour le "+(p.maj?new Date(p.maj).toLocaleDateString("fr-FR"):"")+" · "+(o.nom||"3AIM CFA")+(o.qualiopi?" · Certifié Qualiopi n° "+o.qualiopi:"");
  Array.prototype.forEach.call(document.querySelectorAll("[data-dl]"),function(b){b.onclick=function(){dl(b.getAttribute("data-dl"),b)}});
  Array.prototype.forEach.call(document.querySelectorAll("[data-v]"),function(b){b.onclick=function(){VIEW=b.getAttribute("data-v");store("v",VIEW);render();window.scrollTo(0,0)}});
  $("#out").onclick=function(){store("c",null);store("v",null);VIEW=null;CODE="";DATA=null;$("#app").className="wrap";login("")};
}
(function(){var c=CODE||read("c");if(c)go(c);else login("")})();
</script>
